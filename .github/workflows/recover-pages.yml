name: 清理首次部署残留
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml']
permissions:
  pages: write
  deployments: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 清理已失败且已取消的首次部署记录
        uses: actions/github-script@v8
        with:
          script: |
            const args = {...context.repo, deployment_id: 7567342498};
            const expectedSha = '0af07cb5e6d98ba8a8d5e2b69ba67fd3beb24911';
            const {data: deployment} = await github.rest.repos.getDeployment(args);
            const {data: statuses} = await github.rest.repos.listDeploymentStatuses(args);
            const {data: pagesStatus} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {...context.repo, pages_deployment_id: expectedSha});
            if (deployment.sha !== expectedSha || deployment.environment !== 'github-pages' ||
                statuses[0]?.state !== 'failure' || pagesStatus.status !== 'deployment_cancelled') {
              throw new Error('部署状态与预期不符，停止清理。');
            }
            await github.rest.repos.createDeploymentStatus({...args, state: 'inactive', description: '清理已取消的首次 Pages 部署残留', auto_inactive: false});
            await github.rest.repos.deleteDeployment(args);
            core.info('已清理指定失败部署记录，代码和站点设置保持不变。');
